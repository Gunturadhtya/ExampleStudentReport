<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="add-building" class="modal fade" id="modalAddBuilding" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 12px;">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h1 class="modal-title h5 fw-bold text-dark">Tambah Gedung Baru</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formAddBuilding" onsubmit="event.preventDefault();">
                <div class="modal-body px-4 py-3">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark small">Kode Gedung</label>
                        <input type="text" class="form-control py-2 font-monospace" name="code" placeholder="Misal: FT-BJM" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark small">Nama Gedung</label>
                        <input type="text" class="form-control py-2" name="name" placeholder="Misal: Gedung Teknik Banjarmasin" required>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                    <button type="button" class="btn btn-white border fw-semibold text-dark" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn fw-bold px-4" style="background-color: #BDE0FE; color: #0F172A; border: 1px solid #A2D2FF">Simpan Gedung</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:fragment="edit-building" class="modal fade" id="modalEditBuilding" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 12px;">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h1 class="modal-title h5 fw-bold text-dark">Edit Data Gedung</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formEditBuilding" onsubmit="event.preventDefault();">
                <input type="hidden" id="editBuildingId" name="id">
                <div class="modal-body px-4 py-3">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark small">Kode Gedung</label>
                        <input type="text" class="form-control py-2 font-monospace" id="editBuildingCode" name="code" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark small">Nama Gedung</label>
                        <input type="text" class="form-control py-2" id="editBuildingName" name="name" required>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                    <button type="button" class="btn btn-white border fw-semibold text-dark" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn fw-bold px-4" style="background-color: #BDE0FE; color: #0F172A; border: 1px solid #A2D2FF">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:fragment="delete-building" class="modal fade" id="modalDeleteBuilding" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 12px;">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h1 class="modal-title h5 fw-bold text-danger">Konfirmasi Hapus</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formDeleteBuilding" onsubmit="event.preventDefault();">
                <input type="hidden" id="deleteBuildingId" name="id">
                <div class="modal-body px-4 py-3">
                    <p class="text-dark mb-0">Apakah Anda yakin ingin menghapus gedung <span id="deleteBuildingNameDisplay" class="fw-semibold"></span>?</p>
                    <p class="text-danger small mt-2 mb-0">Peringatan: Seluruh data ruangan yang terkait dengan gedung ini dapat terpengaruh di sistem.</p>
                </div>
                <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                    <button type="button" class="btn btn-white border fw-semibold text-dark" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-danger fw-bold px-4">Ya, Hapus</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
