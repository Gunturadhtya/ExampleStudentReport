<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="actionModals">

    <div class="modal fade" id="modalEditReport" tabindex="-1" aria-hidden="true" th:if="${!isAdmin && report?.status?.name() == 'PENDING'}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 12px;">
                <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                    <h1 class="modal-title h5 fw-bold text-dark">Edit Laporan</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formEditReport" th:data-report-id="${report.id}">
                    <div class="modal-body px-4 py-3">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Judul Laporan</label>
                            <input type="text" class="form-control py-2" id="editReportTitle" th:value="${report.title}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Kategori</label>
                            <select class="form-select py-2" id="editReportCategory" required>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == report.categoryId}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Lokasi</label>
                            <select class="form-select py-2" id="editReportRoom" required>
                                <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.building != null ? room.building.name + ' - ' : ''} + ${room.name}" th:selected="${room.id == report.roomId}"></option>
                            </select>
                        </div>

                        <div class="mb-3 p-3 bg-light rounded" style="border: 1px dashed #cbd5e1;">
                            <label class="form-label fw-semibold text-dark small d-flex align-items-center gap-2">
                                <i class="bi bi-image"></i> Tambah Foto Baru (Opsional)
                            </label>
                            <input type="file" class="form-control py-2 mb-1" id="editReportImages" name="images" multiple accept="image/png, image/jpeg, image/webp">
                            <small class="text-muted d-block" style="font-size: 0.75rem;">Maksimal 3 foto per laporan. Hapus foto lama di atas jika slot penuh.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark small">Deskripsi</label>
                            <textarea class="form-control py-2" id="editReportDesc" rows="4" th:text="${report.description}" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                        <button type="button" class="btn btn-white border fw-semibold text-dark" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn fw-bold px-4" style="background-color: #BDE0FE; color: #0F172A; border: 1px solid #A2D2FF">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDeleteReport" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 12px;">
                <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                    <h1 class="modal-title h5 fw-bold text-danger">Hapus Laporan</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 py-3">
                    <p class="text-dark mb-0">Yakin ingin menghapus laporan ini? Tindakan ini tidak dapat dibatalkan (soft-delete akan dilakukan di database).</p>
                </div>
                <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                    <button type="button" class="btn btn-white border fw-semibold text-dark" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger fw-bold px-4" id="btnConfirmDeleteReport" th:data-report-id="${report.id}">Ya, Hapus</button>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
